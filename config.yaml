# WalkingPal Configuration

# Camera Settings
camera:
  fps: 15.0
  camera_height: 1.5      # Meters. Used for software tilt estimation logic.
  disable_imu: false      # Set to true to force software-only tilt fallback.
  # Extended features
  lr_check: false
  extended_disparity: false
  subpixel: false

# Navigation / Depth thresholds
navigation:
  obstacle_m: 1.2         # Warning distance for general obstacles
  clear_m: 2.0           # "Clear ahead" distance
  dropoff_m: 3.5         # Max distance for floor. > this = dropoff.
  dropoff_invalid_ratio: 0.75 # Ratio of invalid pixels to trigger dropoff
  
  # Environment adaptation
  min_valid_normal: 0.20
  min_valid_dim: 0.30
  dropoff_invalid_boost_dim: 0.10

# Jitter Reduction (Debouncing)
smoothing:
  confirm_frames: 5
  clear_frames: 2
  dir_window: 5
  hazard_on: 2
  hazard_off: 3
  hazard_cooldown_s: 2.0
  pothole_cooldown_s: 2.0

# Features toggle
# Features toggle
features:
  # enable_yolo is deprecated. Use detection.model instead.
  # enable_yolo: false 
  enable_ocr: false
  enable_potholes: false
  
# Detection Settings (MobileNet / YOLO / RT-DETR / RF-DETR)
# Detection Settings (MobileNet / YOLO / RT-DETR / RF-DETR)
detection:
  model: "yolov8"         # Options: none, mobilenet, yolo, yolov8, rtdetr, rf-detr
  fps: 15.0               # YOLOv8n is fast enough for 15fps
  confidence: 0.50
  input_size: [640, 352]  # [width, height] - Required for YOLOv8
  
  # Model specific blobs
  blobs:
    mobilenet: "mobilenet-ssd.blob"
    yolo: "yolo-v4-tiny.blob"   # Legacy/Tiny
    yolov8: "yolov8n.blob"      # SOTA Realtime
    rtdetr: "rtdetr.blob"       
    rf-detr: "rf-detr.blob"     
    
  # Class labels (overrides internal defaults if list provided)
  labels: [] 
  
  # Filter specific classes (empty = all)
  classes: ["dog", "cat", "cow", "person", "car", "motorcycle", "bus", "truck"] # Expanded for YOLOv8 capabilities

# Legacy YOLO Settings (Deprecated, mapped to 'detection' if used)
# yolo:
#   fps: 4.0
#   confindence: 0.50
#   hazards: "dog,cat,cow,person"

# OCR Settings
ocr:
  engine: "auto"     # tesseract, easyocr, auto
  lang: "eng"
  fps: 1.25
  every_s: 5.0
  min_len: 7
  width: 1280
  height: 720
  cooldown_s: 7.0
  auto_min_quality: 0.55
  easyocr_gpu: false
  
# OpenAI Settings
openai:
  model: "gpt-4o-mini"

# Audio / Feedback
audio:
  volume: 1.0           # Master volume 0.0-1.0
  tts_rate: 175
  tts_off: false
  speak_every_s: 1.1
  language: "en"        # en, hi
  spatial_audio: false
  spatial_only: false
  spatial_volume: 0.7

# System
system:
  max_retries: 5
  watchdog_s: 5.0
  log_file: "walkingpal.log"
  debug: false
  monitor: false
  self_test: true

